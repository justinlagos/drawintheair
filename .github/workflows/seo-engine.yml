# Autonomous SEO Engine — cycle runner.
#
# Manual-dispatch only while the policy mode in src/seo/autonomy/policy.ts is
# `shadow`: each run reads Search Console + the analytics DB (read-only role),
# discovers, scores, guard-rails and plans, then HOLDS every change and writes
# the cycle record + summary as a run artifact and job summary. Nothing is
# merged or deployed. `permissions: contents: read` makes that structural.
#
# To move past shadow: flip the policy mode in a reviewed PR, enable the
# schedule below, and widen permissions (contents: write, pull-requests: write)
# in the same PR so the engine can open its own PRs. Never widen here alone.
name: SEO Engine

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC — enable with the mode change

permissions:
  contents: read

concurrency:
  group: seo-engine
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/seo-engine/cycle.ts
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_READ_KEY: ${{ secrets.SUPABASE_SERVICE_READ_KEY }}
          SEO_ENGINE_GH_TOKEN: ${{ secrets.SEO_ENGINE_GH_TOKEN }}
          SEO_ENGINE_OUT: .seo-engine/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-engine-cycle
          path: .seo-engine/out
          if-no-files-found: ignore
          retention-days: 90
