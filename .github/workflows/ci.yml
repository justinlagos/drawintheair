name: CI

# Runs on every PR into master and on pushes to master (post-merge verification),
# plus manual dispatch. Production branch is `master` (NOT `main`).
#
# Deploy contract: these five jobs are the SAME commands Vercel runs (`npm ci`
# then `npm run build`, whose `prebuild` hook runs env-safety + CSP + typecheck)
# plus the local gate `./scripts/check-task.sh` (lint, tests, secret scan).
# All five are to be REQUIRED status checks on master (branch protection).
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

# Least-privilege: workflow only needs to read repo contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One Node major everywhere: .nvmrc, package.json engines, Vercel, CI.
  NODE_VERSION: '24'

jobs:
  # lint is green (0 errors) and ratcheted at --max-warnings in package.json.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run type-check

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Scan for committed secrets
        run: npm run check:secrets
      - name: Validate Content-Security-Policy
        run: npm run check:csp
      - name: Environment-safety guard (no prod refs / leaked service-role)
        run: npm run check:env-safety
      - name: Environment-safety guard rejects a production build with no Supabase vars
        # Proves the guard that protects the Vercel production build actually fails.
        env:
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_REF: master
        run: |
          if npm run check:env-safety; then
            echo "::error::env-safety guard passed a production build with no VITE_SUPABASE_* vars"; exit 1
          fi
          echo "guard correctly failed"

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run unit tests (mocked MediaPipe; no webcam/network)
        run: npm run test

  build:
    name: build
    runs-on: ubuntu-latest
    # Uses SAFE PLACEHOLDER env so the production build compiles in CI without
    # any real or production credentials. These are NOT secrets.
    env:
      VITE_SUPABASE_URL: https://example-preview.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      VITE_APP_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Production build (same command as Vercel; prebuild runs env-safety + CSP + typecheck)
        run: npm run build
      - name: Assert SSG prerender output (production baseline = 93 full-body routes)
        run: |
          n=$(find dist -name index.html -not -path dist/index.html | wc -l)
          echo "prerendered route files: $n"
          if [ "$n" -lt 93 ]; then
            echo "::error::expected at least 93 prerendered route files, got $n"; exit 1
          fi
